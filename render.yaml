# Render Blueprint — one-click SFU service
# https://dashboard.render.com → New → Blueprint

services:
  - type: web
    name: webrtc-room-sfu
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      # Set ANNOUNCED_IP to your Render service hostname after first deploy
      - key: ANNOUNCED_IP
        sync: false
      - key: MEDIASOUP_MIN_PORT
        value: "40000"
      - key: MEDIASOUP_MAX_PORT
        value: "40050"
